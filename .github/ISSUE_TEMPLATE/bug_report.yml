name: Bug 报告
description: 报告 Mivo 的可复现问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 请先查阅 README 和已知限制。勿上传 API Key、访问令牌、私人录音、完整 Vault 或未脱敏日志；安全漏洞请遵循 SECURITY.md。
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      placeholder: Mivo 版本或 commit、操作系统、芯片架构
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: 使用公开或可分享的最小样本，说明操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏错误信息
      description: 仅提供定位问题所需的片段，不附完整运行日志或密钥。
      render: text
