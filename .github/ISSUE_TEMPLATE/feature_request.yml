name: 功能建议
description: 提出 Mivo 的实际使用场景
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述具体使用场景和现有流程的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 预期行为
      description: 说明期望的交互、输入与输出；如有替代方案可一并描述。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与约束
      description: 对本地存储、隐私、模型用量或兼容性的要求。
